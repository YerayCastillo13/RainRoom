<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a10">
<title>RainRoom · tu sala de lluvia</title>
<meta name="description" content="Crea tu propia sala: lluvia sobre el cristal, sonidos ambientales y fondos a tu medida para concentrarte o desconectar.">
<meta property="og:title" content="RainRoom"><meta property="og:description" content="Tu propio espacio digital: lluvia, tormenta y calma.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23060a10'/%3E%3Cpath d='M16 6c4 6 7 9 7 13a7 7 0 0 1-14 0c0-4 3-7 7-13z' fill='%239fd0ff'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RainRoom">
<link rel="stylesheet" href="css/style.css">
</head><body>
<noscript>RainRoom necesita JavaScript para funcionar.</noscript>
<canvas id="gl"></canvas><div id="wl"></div><div id="veil"></div>
<div id="ui">
 <button id="brand" aria-label="Abrir salas"><span>RainRoom</span><small><i id="rn" style="font-style:normal"></i> &#8964;</small></button>
 <div id="pop" role="group" aria-label="Volumen"><b></b><input type="range" min="0" max="1" step=".01" aria-label="Volumen"><output></output></div>
 <nav id="dock" aria-label="Sonidos"></nav>
 <section id="sheet" role="dialog" aria-label="Salas y mezcla">
  <div id="shHead"><div class="grip"></div><button class="x" id="shClose" aria-label="Cerrar">&#10005;</button>
   <div id="tabs" role="tablist"><button role="tab">Salas</button><button role="tab">Sonidos</button><button role="tab">Widgets</button><button role="tab">Ajustes</button><i id="tind"></i></div></div>
  <div class="pn"><div id="rooms"></div></div>
  <div class="pn"><div class="chips" id="pres"></div><div class="row" id="vrow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM16.5 9a4 4 0 0 1 0 6"/></svg></span><div class="rc"><div class="rt"><span>Volumen general</span><output id="mvv"></output></div><input type="range" id="mv" min="0" max="1" step=".01" aria-label="Volumen general"></div></div><div id="mix"></div>
   <div class="row" id="grow"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 4c3 4 5 6 5 9a5 5 0 0 1-10 0c0-3 2-5 5-9z"/></svg></span><div class="rc"><div class="rt"><span>Gotas</span><output id="intv"></output></div><input type="range" id="int" min="0" max="1" step=".05" aria-label="Intensidad de las gotas"></div></div>
   <p class="hint">Llévalo a 0 para una sala sin lluvia.</p></div>
  <div class="pn"><p class="hint">Toca para añadir o quitar. Arrástralos por la pantalla y ciérralos con la ×.</p><div id="wsel" class="chips"></div></div>
  <div class="pn"><h3>Noche</h3><div id="nsel" class="chips"></div><h3>Tu foto</h3><div class="chips"><button class="chip" id="fabP">Subir foto</button><button class="chip" id="fabX">Quitar mi foto</button></div></div>
 </section>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="msg">Toca la pantalla para activar el sonido</div>
<script src="js/rooms.js" defer></script>
<script src="js/widgets.js" defer></script>
<script src="js/app.js" defer></script>
</body></html>
