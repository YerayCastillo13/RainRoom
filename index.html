<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a10">
<title>RainRoom · tu sala de lluvia</title>
<meta name="description" content="Crea tu propia sala: lluvia sobre el cristal, sonidos ambientales y fondos a tu medida para concentrarte o desconectar.">
<meta property="og:title" content="RainRoom"><meta property="og:description" content="Tu propio espacio digital: lluvia, tormenta y calma.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23060a10'/%3E%3Cpath d='M16 6c4 6 7 9 7 13a7 7 0 0 1-14 0c0-4 3-7 7-13z' fill='%239fd0ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head><body>
<canvas id="gl"></canvas><div id="wl"></div><div id="veil"></div>
<div id="ui">
 <div id="brand">RainRoom</div>
 <button class="fab" id="fabP" aria-label="Cargar tu foto"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg></button>
 <button class="fab" id="fabX" aria-label="Quitar tu foto">&#10005;</button>
 <nav id="dock" aria-label="Sonidos"></nav>
 <section id="sheet" role="dialog" aria-label="Salas y mezcla">
  <div id="shHead"><div class="grip"></div><b>Tu sala</b><button class="x" id="shClose" aria-label="Cerrar">&#10005;</button></div>
  <h3>Salas</h3><div id="rooms"></div>
  <h3>Mezcla</h3><div id="mix"></div>
  <h3>Widgets</h3><div id="wsel" class="chips"></div>
  <h3>Cristal</h3><label class="row"><svg viewBox="0 0 24 24"><path d="M12 4c3 4 5 6 5 9a5 5 0 0 1-10 0c0-3 2-5 5-9z"/></svg><span>Gotas</span><input type="range" id="int" min="0" max="1" step=".05" aria-label="Intensidad de las gotas"></label><p class="hint">Llévalo a 0 para una sala sin lluvia.</p>
 </section>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="msg">Toca la pantalla para activar el sonido</div>
<script src="js/rooms.js" defer></script>
<script src="js/widgets.js" defer></script>
<script src="js/app.js" defer></script>
</body></html>
